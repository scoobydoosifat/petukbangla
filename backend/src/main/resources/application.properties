spring.application.name=PetukBangla
spring.config.import=optional:file:./.env[.properties]
server.port=${PORT:9092}
server.address=0.0.0.0

# Resource and parser limits: reject oversized requests before they reach controllers.
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=2MB
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1280KB

# MongoDB Atlas credentials are supplied by the git-ignored .env locally and by Render environment variables in production.
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:petuk_bangla}
spring.data.mongodb.auto-index-creation=true

app.jwt.secret=${JWT_SECRET:petuk-bangla-development-secret-key-change-before-production-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
app.environment=${APP_ENV:development}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.sender-email=${BREVO_SENDER_EMAIL:}
app.brevo.sender-name=${BREVO_SENDER_NAME:petukbangla}
app.admin.name=${ADMIN_NAME:Petuk Bangla Admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.jackson.default-property-inclusion=non_null
